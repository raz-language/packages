name: Registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject changes to published package versions
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}"
          changed="$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- 'packages/**/*.dpk')"
          if [ -n "$changed" ]; then
            echo "$changed"
            if echo "$changed" | awk '$1 != "A" { bad=1 } END { exit bad ? 0 : 1 }'; then
              echo "Published package versions are immutable; only new .dpk paths may be added." >&2
              exit 1
            fi
          fi
      - name: Generate registry index and static API
        if: github.event_name == 'push'
        run: |
          python scripts/generate_index.py
          python scripts/generate_api.py
          python scripts/generate_search.py
      - name: Verify generated registry files
        if: github.event_name == 'pull_request'
        run: |
          python scripts/generate_index.py --check
          python scripts/generate_api.py --check
          python scripts/generate_search.py --check
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Commit generated registry files
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- index.txt search.txt api/v1; then
            echo "Registry metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.txt search.txt api/v1
          git commit -m "registry: refresh generated index and API"
          git push
